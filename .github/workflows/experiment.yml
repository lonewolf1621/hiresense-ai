name: feature-experiment

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "benchmarks/feature_experiment.py"

jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -r requirements.txt "datasets>=2.19,<3" "pyarrow==16.1.0" "scikit-learn==1.5.2" "scipy==1.13.1"
      - name: Run experiment
        run: python benchmarks/feature_experiment.py --out benchmarks/results
