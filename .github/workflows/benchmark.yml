name: benchmark

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "app/services/matcher.py"
      - "benchmarks/**"

jobs:
  fit-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -r requirements.txt "datasets>=2.19,<3" "pyarrow==16.1.0"
      - name: Run benchmark
        run: python benchmarks/fit_benchmark.py --out benchmarks/results
      - uses: actions/upload-artifact@v4
        with:
          name: fit-benchmark
          path: benchmarks/results/fit_benchmark.json
