name: benchmark

on:
  workflow_dispatch:
  schedule:
    - cron: "37 4 * * 0"   # weekly re-run on the public dataset
  push:
    branches: [ main ]
    paths:
      - "app/services/matcher.py"
      - "benchmarks/**"

jobs:
  fit-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -r requirements.txt "datasets>=2.19,<3" "pyarrow==16.1.0"
      - name: Run benchmark
        run: python benchmarks/fit_benchmark.py --out benchmarks/results
      - uses: actions/upload-artifact@v4
        with:
          name: fit-benchmark
          path: benchmarks/results/fit_benchmark.json
      - name: Regression guard (fail if the semantic AUC drops below the published 0.56)
        run: |
          python - <<'PY'
          import json
          d = json.load(open("benchmarks/results/fit_benchmark.json"))
          auc = d["test"]["semantic_coverage_only"]["auc_fit_vs_nofit"]
          print(f"semantic AUC fit vs no-fit: {auc}")
          if auc < 0.55:
              raise SystemExit(f"Regression: semantic AUC {auc} < 0.55")
          PY
