name: tests

on:
  push:
    branches: [ main ]
  pull_request:
  schedule:
    - cron: "23 5 * * 1"   # weekly, catches dependency drift
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Tests
        run: pytest -q
      - name: Skill-extraction evaluation
        run: python evaluate.py
