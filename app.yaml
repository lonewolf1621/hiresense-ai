runtime: python311
service: hiresense-api
env: standard

handlers:
  - url: /.*
    script: auto

env_variables:
  GCP_PROJECT_ID: "hiresense-ai-prod"
  GCS_BUCKET_NAME: "hiresense-ai-resumes"
  API_BASE_URL: "https://hiresense-api.run.app/api"

automatic_scaling:
  min_instances: 1
  max_instances: 10